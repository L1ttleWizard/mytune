name: mytune
description: "Custom Spotify client for Android — Web API + WebView."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
